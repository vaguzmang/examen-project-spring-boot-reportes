spring.application.name=demoproject

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/logitrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USERNAME:logitrack}
spring.datasource.password=${DB_PASSWORD:logitrack123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mvc.servlet.load-on-startup=1

jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcd}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

server.port=8080

logging.level.org.springframework.security=INFO
