<div class="module-view fade-in">
    <div class="page-head">
        <div>
            <h2>Productos</h2>
            <p>Catálogo general de productos registrados en LogiTrack.</p>
        </div>
        <button class="btn btn-primary" id="newProductButton">+ Nuevo producto</button>
    </div>

    <div class="module-toolbar">
        <div class="search-box">
            <input id="productSearch" type="search" placeholder="Buscar por nombre o categoría">
        </div>
        <span class="badge badge-amber" id="lowStockCount">0 con stock bajo</span>
    </div>

    <div class="table-card">
        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Producto</th><th>Categoría</th>
                        <th>Stock</th><th>Precio</th><th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="productTableBody"></tbody>
            </table>
        </div>
        <div class="table-footer" id="productTableFooter">Cargando productos...</div>
    </div>

    <div class="modal" id="productModal" aria-hidden="true">
        <div class="modal-card">
            <div class="modal-head">
                <h3 id="productModalTitle">Nuevo producto</h3>
                <button class="icon-button modal-close" type="button">×</button>
            </div>
            <form id="productForm">
                <div class="modal-body form-grid">
                    <input type="hidden" id="productId">
                    <div class="form-group">
                        <label for="productName">Nombre</label>
                        <input id="productName" type="text" required maxlength="150">
                    </div>
                    <div class="form-group">
                        <label for="productCategory">Categoría</label>
                        <input id="productCategory" type="text" required maxlength="100">
                    </div>
                    <div class="form-group">
                        <label for="productPrice">Precio</label>
                        <input id="productPrice" type="number" min="0" step="0.01" required>
                    </div>
                    <p class="form-span" style="font-size:.85rem;color:var(--text-muted,#6b7280)">
                        El stock se administra por bodega en el módulo <strong>Inventario</strong>.
                    </p>
                </div>
                <div class="modal-foot">
                    <button class="btn btn-secondary modal-close" type="button">Cancelar</button>
                    <button class="btn btn-primary" type="submit">Guardar producto</button>
                </div>
            </form>
        </div>
    </div>
</div>
